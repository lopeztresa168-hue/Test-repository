        run: |
          API_RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$THIRD_REPO/contents/analysis_results/portfolios_whole_time.csv.enc")
          DL_URL=$(echo "$API_RESP" | jq -r '.download_url // empty' 2>/dev/null || echo "")
          if [ -n "$DL_URL" ]; then
