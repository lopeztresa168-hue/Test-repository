          find /tmp/portfolios_wt_parts -name 'part_*.parquet' | wc -l
          ls -la /tmp/portfolios_wt_parts/ || echo "⚠️ پوشه‌ی parts وجود ندارد"
          du -sh /tmp/portfolios_wt_parts/ 2>/dev/null || true
          free -h

      - name: دانلود portfolios_whole_time.csv قبلی از مخزن سوم (برای ادغام با تاریخچه)
        env:
