name: Pool Matrix Dispatcher

# با ساخته شدن (push) فایل pool_matrix.json در ریشه‌ی مخزن اصلی، pool_search را به‌صورت ماتریکس اجرا می‌کند.
# معماری (همه‌چیز داخل همین run، بدون صدا زدن analysis.yml برای هر تنظیمات):
#   prepare  : خواندن/اعتبارسنجی فایل و انتخاب ۲۰ تای اول
#   prebuild : یک بار؛ برای هر ترکیب یکتای fee/min_trades/end اگر کش کهنه بود، اجرای «فقط-کش» تک‌نویسنده
#              (modules/pool_ensure_cache.sh) را می‌سازد و منتظر می‌ماند. ترکیب‌هایی که کش‌شان کامل نشد در این دسته نمی‌آیند.
#   search   : ۲۰ job همزمان؛ هر کدام pool_search --mode search را برای tag خودش اجرا و نتیجه‌ی رمزنگاری‌شده را artifact می‌کند
#              (هیچ job ای روی مخزن چیزی push نمی‌کند).
#   commit   : تنها نویسنده؛ همه‌ی نتیجه‌ها را با یک commit/push به analysis_results/pool_matrix/ مخزن سوم می‌برد،
#              بعد tagهای موفق را از فایل تنظیمات برمی‌دارد و دور بعدی tagهای repeat را (با configs_json) صدا می‌زند.
#
# دسته‌بندی (batch): فایل می‌تواند هر تعداد تنظیمات داشته باشد (مثلاً ۱۰۰ تا)، ولی هر اجرا فقط ۲۰ تای اول
# را dispatch می‌کند. بعد از dispatch موفق، همان ۲۰ تا از فایل حذف می‌شوند و بقیه در فایل می‌مانند؛
# با «Run workflow» دستی (یا push دوباره‌ی فایل) ۲۰ تای بعدی اجرا می‌شود. وقتی چیزی نماند فایل حذف می‌شود.
# tagهای خودکار (cfgNN) از جای تنظیمات در فایل اصلی ساخته می‌شوند و موقع حذف دسته، داخل فایل نوشته می‌شوند
# تا در دسته‌ی بعد عوض نشوند.
#
# کش: اگر کش کاندیداهای ترکیب fee / min_trades / end یک تنظیمات به‌روز نباشد، آن اجرا خطا نمی‌دهد؛ analysis.yml
# (job: pool-prebuild) خودش یک اجرای «فقط-کش» برای همان ترکیب می‌سازد، منتظر کامل شدنش می‌ماند و بعد جستجو را ادامه می‌دهد.
# کش ترکیب‌های مختلف کنار هم در آرشیو pool_cache/ می‌مانند (فشرده، با تقسیم‌بندی خودکار توسط modules/pool_cache.sh).
#
# هر تنظیمات می‌تواند هر فیلدی را جدا override کند (مثلاً min_trades متفاوت)؛ فیلدی که ننویسی از defaults
# و بعد از مقدار پیش‌فرض خود workflow می‌آید.
#
# قالب فایل (دو شکل پذیرفته می‌شود):
#   1) آرایه:   [ {"tag":"a1","objective":"sortino"}, {...} ]
#   2) شیء:     {"defaults": {"max_members":25,"fee":0}, "configs": [ {"tag":"a1","objective":"sortino"}, ... ]}
# فیلدهای هر تنظیمات (همه اختیاری جز tag که اگر نباشد cfg01..، cfg02.. ساخته می‌شود):
#   tag, objective(green|sortino|sharpe), max_members, max_per_file, min_trades, fee, tune_weights(bool),
#   polish(bool), end(YYYY-MM), time_budget(دقیقه), seed, repeat(bool), repeat_hours(عدد)
#   repeat_hours: فقط با polish. نباشد/0 و repeat=true → ۲۴/۷ (تا interrupt.flag)؛ مثلاً 50 → تکرار فقط ۵۰ ساعت
#   (نوشتن repeat_hours>0 به‌تنهایی repeat را هم روشن می‌کند). هر تنظیمات مقدار خودش را دارد.

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    paths:
      - 'pool_matrix.json'
  workflow_dispatch:
    inputs:
      matrix_file:
        description: 'مسیر فایل تنظیمات (پیش‌فرض pool_matrix.json)'
        required: false
        default: 'pool_matrix.json'
      configs_json:
        description: 'داخلی (توسط دور قبلی repeat پر می‌شود): لیست تنظیمات به‌جای فایل؛ فایل تنظیمات دست نمی‌خورد. دستی پر نکن'
        required: false
        default: ''

concurrency:
  # دورهای repeat (configs_json) هر کدام گروه مستقل دارند تا اجرای pending فایل جدید، زنجیره‌ی repeat را لغو نکند
  group: ${{ inputs.configs_json != '' && format('pool-matrix-repeat-{0}', github.run_id) || 'pool-matrix-dispatch' }}
  cancel-in-progress: false

env:
  MATRIX_FILE: ${{ inputs.matrix_file || 'pool_matrix.json' }}
  BATCH: 20   # حداکثر تعداد تنظیمات در هر اجرا

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      count: ${{ steps.parse.outputs.count }}
      total: ${{ steps.parse.outputs.total }}
      tags: ${{ steps.parse.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: خواندن و اعتبارسنجی فایل تنظیمات
        id: parse
        env:
          CFGS: ${{ inputs.configs_json }}
        run: |
          fail() { echo "❌ $1"; exit 1; }
          SRC="$MATRIX_FILE"
          if [ -n "$CFGS" ]; then printf '%s' "$CFGS" > /tmp/repeat_src.json; SRC=/tmp/repeat_src.json; fi
          if [ ! -f "$SRC" ]; then
            echo "ℹ️ $MATRIX_FILE وجود ندارد (احتمالاً حذف شده) — کاری برای انجام نیست."
            echo "count=0" >> "$GITHUB_OUTPUT"; echo "total=0" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"; echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq empty "$SRC" 2>/dev/null || fail "$MATRIX_FILE یک JSON معتبر نیست."

          # آرایه یا {defaults, configs} → لیست نهایی؛ مقادیر همه به رشته؛ tag خودکار
          jq -c '
            (if type=="array" then {defaults:{}, configs:.} else {defaults:(.defaults // {}), configs:(.configs // [])} end)
            | .defaults as $d
            | [ .configs | to_entries[] | ($d + .value) as $c
                | { i: .key,
                    tag:          (($c.tag // ("cfg" + ((.key+1)|tostring|if length<2 then "0"+. else . end))) | tostring),
                    objective:    (($c.objective    // "green") | tostring),
                    max_members:  (($c.max_members  // 25)     | tostring),
                    max_per_file: (($c.max_per_file // 3)      | tostring),
                    min_trades:   (($c.min_trades   // 5)      | tostring),
                    fee:          (($c.fee          // 0)      | tostring),
                    tune_weights: (($c.tune_weights // false)  | tostring),
                    polish:       (($c.polish       // false)  | tostring),
                    end:          (($c.end          // "")     | tostring),
                    time_budget:  (($c.time_budget  // 0)      | tostring),
                    seed:         (($c.seed         // 0)      | tostring),
                    repeat_hours: (($c.repeat_hours // 0)      | tostring),
                    repeat_until: (($c.repeat_until // 0)      | tostring),
                    repeat:       ((($c.repeat // false) or ((($c.repeat_hours // 0) | tonumber) > 0)) | tostring) } ]
          ' "$SRC" > /tmp/all.json

          TOTAL=$(jq length /tmp/all.json)
          [ "$TOTAL" -ge 1 ] || fail "هیچ تنظیماتی در فایل نیست."

          # tag تکراری → دو اجرا روی یک فایل نتیجه می‌نویسند
          DUP=$(jq -r '[.[].tag] | group_by(.) | map(select(length>1) | .[0]) | join(", ")' /tmp/all.json)
          [ -z "$DUP" ] || fail "tag تکراری: $DUP"

          # همان اعتبارسنجی‌های analysis.yml
          BAD=$(jq -r '
            .[] | select(
              ( .tag          | test("^[A-Za-z0-9_-]{1,40}$") | not) or
              ( .objective    | test("^(green|sortino|sharpe)$") | not) or
              ( .max_members  | test("^[0-9]+$") | not) or
              ( .max_per_file | test("^[0-9]+$") | not) or
              ( .min_trades   | test("^[0-9]+$") | not) or
              ( .fee          | test("^[0-9]*\\.?[0-9]+$") | not) or
              ( .tune_weights | test("^(true|false)$") | not) or
              ( .polish       | test("^(true|false)$") | not) or
              ( .repeat       | test("^(true|false)$") | not) or
              ( .repeat_hours | test("^[0-9]*\\.?[0-9]+$") | not) or
              ( .repeat_until | test("^[0-9]+$") | not) or
              ( .end          | test("^([0-9]{4}-[0-9]{2})?$") | not) or
              ( .time_budget  | test("^[0-9]+$") | not) or
              ( .seed         | test("^[0-9]+$") | not)
            ) | "\(.tag) → \(. | tostring)"' /tmp/all.json)
          [ -z "$BAD" ] || { echo "$BAD"; fail "پارامتر نامعتبر در تنظیمات بالا."; }

          # فقط ۲۰ تای اول این اجرا (همه‌ی فایل بالا اعتبارسنجی شد)
          jq -c --argjson b "$BATCH" '.[:$b]' /tmp/all.json > /tmp/matrix.json
          N=$(jq length /tmp/matrix.json)
          REST=$(( TOTAL - N ))

          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "tags=$(jq -r '[.[].tag] | join(",")' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## pool_matrix: این اجرا $N از $TOTAL تنظیمات"
            if [ "$REST" -gt 0 ]; then
              echo "⏭️ $REST تنظیمات در فایل می‌ماند؛ برای دسته‌ی بعد workflow را دوباره اجرا کن (Run workflow)."
            fi
            echo '| tag | objective | members | per_file | min_trades | fee | tune | polish | end | budget | seed | repeat | hours |'
            echo '|---|---|---|---|---|---|---|---|---|---|---|---|---|'
            jq -r '.[] | "| \(.tag) | \(.objective) | \(.max_members) | \(.max_per_file) | \(.min_trades) | \(.fee) | \(.tune_weights) | \(.polish) | \(.end) | \(.time_budget) | \(.seed) | \(.repeat) | \(.repeat_hours) |"' /tmp/matrix.json
          } >> "$GITHUB_STEP_SUMMARY"

  prebuild:
    # یک بار برای کل دسته: کش هر ترکیب یکتای fee/min_trades/end را کامل می‌کند (اجرای «فقط-کش» تک‌نویسنده، مثل قبل).
    # فقط تنظیماتی که کش‌شان آماده است وارد search می‌شوند؛ بقیه در فایل می‌مانند تا اجرای بعدی.
    needs: prepare
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      matrix: ${{ steps.ensure.outputs.matrix }}
      count: ${{ steps.ensure.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: بررسی interrupt.flag
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$THIRD_REPO/contents/interrupt.flag")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "🛑 interrupt.flag یافت شد — اجرا متوقف می‌شود."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas numpy cryptography

      - name: Clone سبک مخزن سوم
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git" /tmp/third_repo
          git -C /tmp/third_repo ls-tree HEAD:aggregated >/dev/null 2>&1 || { echo "❌ پوشه aggregated در مخزن سوم نیست."; exit 1; }

      - name: یافتن market_regime.json
        run: |
          REGIME_FILE=$(find "$GITHUB_WORKSPACE" -name 'market_regime.json' -not -path '*/.git/*' 2>/dev/null | head -n 1)
          if [ -z "$REGIME_FILE" ]; then
            P=$(git -C /tmp/third_repo ls-tree -r --name-only HEAD | grep -m1 -E '(^|/)market_regime\.json$' || true)
            if [ -n "$P" ]; then
              git -C /tmp/third_repo checkout HEAD -- "$P"
              REGIME_FILE="/tmp/third_repo/$P"
            fi
          fi
          if [ -z "$REGIME_FILE" ] || [ ! -s "$REGIME_FILE" ]; then
            echo "❌ market_regime.json یافت نشد."; exit 1
          fi
          mkdir -p /tmp/pool_regime
          cp "$REGIME_FILE" /tmp/pool_regime/market_regime.json

      - uses: actions/upload-artifact@v4
        with:
          name: pool-matrix-regime
          path: /tmp/pool_regime/market_regime.json
          retention-days: 1

      - name: بازیابی آرشیو کش
        env:
          POOL_CACHE_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: bash modules/pool_cache.sh restore /tmp/third_repo

      - name: کش هر ترکیب fee/min_trades/end را کامل کن و تنظیمات آماده را برگردان
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set +e
          READY=()
          n=0
          while IFS='|' read -r FEE MT END; do
            n=$((n+1))
            ARGS=(--mode plan --repo-dir /tmp/third_repo --regime /tmp/pool_regime/market_regime.json
                  --fee "$FEE" --min-trades "$MT" --queue-dir "/tmp/pool_queue_$n" --chunk-size 10 --max-files 1000)
            [ -n "$END" ] && ARGS+=(--end "$END")
            if ! python -u modules/pool_search.py "${ARGS[@]}"; then
              echo "⚠️ [fee=$FEE min=$MT end=${END:-default}] plan شکست خورد — این ترکیب در این دسته نمی‌آید."; continue
            fi
            PENDING=$(jq '.pending_total' "/tmp/pool_queue_$n/plan.json")
            if [ "$PENDING" -eq 0 ]; then
              echo "✅ [fee=$FEE min=$MT end=${END:-default}] کش به‌روز است."
              READY+=("$FEE|$MT|$END"); continue
            fi
            echo "🔧 [fee=$FEE min=$MT end=${END:-default}] $PENDING فایل بدون کش — اجرای فقط-کش..."
            bash modules/pool_ensure_cache.sh "$FEE" "$MT" "$END"
            RC=$?
            if [ "$RC" -eq 0 ]; then READY+=("$FEE|$MT|$END")
            else echo "⚠️ [fee=$FEE min=$MT end=${END:-default}] کش کامل نشد (rc=$RC) — این ترکیب در فایل می‌ماند."; fi
          done < <(jq -r '[.[] | [.fee, .min_trades, .end] | join("|")] | unique[]' <<<"$MATRIX")

          if [ "${#READY[@]}" -eq 0 ]; then READY_JSON='[]'
          else READY_JSON=$(printf '%s\n' "${READY[@]}" | jq -R . | jq -sc .); fi
          OUT=$(jq -c --argjson r "$READY_JSON" '[ .[] | select(([.fee,.min_trades,.end] | join("|")) as $k | ($r | index($k)) != null) ]' <<<"$MATRIX")
          echo "matrix=$OUT" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$OUT")" >> "$GITHUB_OUTPUT"
          echo "## prebuild: $(jq length <<<"$OUT") از $(jq length <<<"$MATRIX") تنظیمات آماده‌ی جستجو" >> "$GITHUB_STEP_SUMMARY"

  search:
    # ۲۰ جستجوی همزمان؛ هیچ‌کدام روی مخزن چیزی نمی‌نویسند، فقط نتیجه را artifact می‌کنند.
    needs: [prepare, prebuild]
    if: ${{ needs.prebuild.outputs.count != '' && needs.prebuild.outputs.count != '0' }}
    name: search ${{ matrix.cfg.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cfg: ${{ fromJson(needs.prebuild.outputs.matrix) }}
    env:
      POOL_TAG: ${{ matrix.cfg.tag }}
      POOL_OBJECTIVE: ${{ matrix.cfg.objective }}
      POOL_MAX_MEMBERS: ${{ matrix.cfg.max_members }}
      POOL_MAX_PER_FILE: ${{ matrix.cfg.max_per_file }}
      POOL_MIN_TRADES: ${{ matrix.cfg.min_trades }}
      POOL_FEE: ${{ matrix.cfg.fee }}
      POOL_TUNE_WEIGHTS: ${{ matrix.cfg.tune_weights }}
      POOL_POLISH: ${{ matrix.cfg.polish }}
      POOL_END: ${{ matrix.cfg.end }}
      POOL_TIME_BUDGET: ${{ matrix.cfg.time_budget }}
      POOL_SEED: ${{ matrix.cfg.seed }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas numpy cryptography

      - uses: actions/download-artifact@v4
        with:
          name: pool-matrix-regime
          path: /tmp/pool_regime

      - name: Clone سبک مخزن سوم (آرشیو کش + نتایج قبلی برای polish)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git" /tmp/third_repo
          cd /tmp/third_repo
          git sparse-checkout set pool_cache pool_candidates analysis_results

      - name: بازیابی آرشیو کش
        env:
          POOL_CACHE_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: bash modules/pool_cache.sh restore /tmp/third_repo

      - name: جستجو (pool_search --mode search)
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: |
          mkdir -p /tmp/pool_results
          ARGS=(--mode search --password "$RESULTS_PASSWORD"
                --repo-dir /tmp/third_repo
                --regime /tmp/pool_regime/market_regime.json
                --fee "$POOL_FEE" --min-trades "$POOL_MIN_TRADES"
                --out /tmp/pool_results
                --max-members "$POOL_MAX_MEMBERS" --max-per-file "$POOL_MAX_PER_FILE"
                --objective "$POOL_OBJECTIVE" --tag "$POOL_TAG")
          if [ "$POOL_TUNE_WEIGHTS" = "true" ]; then ARGS+=(--tune-weights); fi
          if [ "$POOL_POLISH" = "true" ]; then ARGS+=(--polish); fi
          if [ -n "$POOL_END" ]; then ARGS+=(--end "$POOL_END"); fi
          if [ "${POOL_TIME_BUDGET:-0}" != "0" ]; then ARGS+=(--time-budget "$POOL_TIME_BUDGET" --seed "${POOL_SEED:-0}"); fi
          set -o pipefail
          python -u modules/pool_search.py "${ARGS[@]}" 2>&1 | tee /tmp/pool_results/run.log
          for f in selected.csv filters_compare.csv portfolio_monthly_by_filter.csv; do
            [ -s "/tmp/pool_results/$f" ] || { echo "❌ فایل خروجی $f ساخته نشد."; exit 1; }
          done

      - name: خلاصه‌ی نتایج
        run: |
          { echo "## pool_search [$POOL_TAG]"; echo '```'; sed -n '/caches loaded/,$p' /tmp/pool_results/run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: بسته‌بندی و رمزنگاری نتیجه (فقط فایل؛ push توسط job commit)
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: |
          mkdir -p /tmp/pool_search_results /tmp/out
          cp /tmp/pool_results/*.csv /tmp/pool_results/coverage.json /tmp/pool_results/run.log /tmp/pool_search_results/
          tar -czf /tmp/pool_search_results.tar.gz -C /tmp pool_search_results
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.RESULTS_PASSWORD;
            const data=fs.readFileSync('/tmp/pool_search_results.tar.gz');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=crypto.randomBytes(16);
            const cipher=crypto.createCipheriv('aes-256-cbc',key,iv);
            const enc=Buffer.concat([iv,cipher.update(data),cipher.final()]);
            fs.writeFileSync('/tmp/out/${POOL_TAG}.tar.gz.enc', enc);
          "

      - uses: actions/upload-artifact@v4
        with:
          name: pool-matrix-result-${{ matrix.cfg.tag }}
          path: /tmp/out/${{ matrix.cfg.tag }}.tar.gz.enc
          retention-days: 1
          if-no-files-found: error

      - name: لاگ/CSV برای بررسی
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-matrix-logs-${{ matrix.cfg.tag }}
          path: |
            /tmp/pool_results/*.csv
            /tmp/pool_results/coverage.json
            /tmp/pool_results/run.log
          retention-days: 14
          if-no-files-found: warn

  commit:
    # تنها نویسنده: یک commit/push برای همه‌ی نتیجه‌ها، بعد برداشتن tagهای موفق از فایل و دور بعدی repeat.
    needs: [prepare, prebuild, search]
    if: ${{ !cancelled() && needs.search.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        continue-on-error: true      # اگر همه‌ی جستجوها شکست خورده باشند آرتیفکتی نیست
        with:
          pattern: pool-matrix-result-*
          path: /tmp/results
          merge-multiple: true       # هر آرتیفکت یک فایل <tag>.tar.gz.enc دارد

      - name: ۱) یک commit/push نتایج به مخزن سوم
        id: push
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          shopt -s nullglob
          FILES=(/tmp/results/*.tar.gz.enc)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "done=[]" >> "$GITHUB_OUTPUT"; echo "❌ هیچ نتیجه‌ای نیست."; exit 1
          fi
          git clone --depth=1 --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git" /tmp/third_repo
          cd /tmp/third_repo
          git sparse-checkout set analysis_results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p analysis_results/pool_matrix
          DONE=()
          for f in "${FILES[@]}"; do
            tag=$(basename "$f" .tar.gz.enc)
            cp "$f" "analysis_results/pool_matrix/${tag}.tar.gz.enc"
            git add --sparse -f "analysis_results/pool_matrix/${tag}.tar.gz.enc"
            DONE+=("$tag")
          done
          git commit -q -m "pool_matrix results: ${#DONE[@]} configs (run ${{ github.run_id }})"
          for attempt in $(seq 1 10); do
            git pull --rebase -q || true
            if git push -q; then
              echo "✅ push یک‌باره‌ی ${#DONE[@]} نتیجه موفق بود (تلاش $attempt)."
              echo "done=$(printf '%s\n' "${DONE[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $(( (RANDOM % 10) + 3 ))
          done
          echo "done=[]" >> "$GITHUB_OUTPUT"
          echo "❌ push پس از ۱۰ تلاش ناموفق بود (فایل تنظیمات دست‌نخورده می‌ماند)."; exit 1

      - name: ۲) برداشتن tagهای موفق از فایل تنظیمات (فقط اجرای عادی، نه دور repeat)
        if: ${{ steps.push.outputs.done != '' && steps.push.outputs.done != '[]' && inputs.configs_json == '' }}
        env:
          BATCH_TAGS: ${{ needs.prepare.outputs.tags }}
          BATCH_COUNT: ${{ needs.prepare.outputs.count }}
          DONE_JSON: ${{ steps.push.outputs.done }}
        run: |
          [ -f "$MATRIX_FILE" ] || { echo "ℹ️ $MATRIX_FILE دیگر وجود ندارد."; exit 0; }
          CUR_TAGS=$(jq -r --argjson b "$BATCH_COUNT" '
            (if type=="array" then {defaults:{}, configs:.} else {defaults:(.defaults // {}), configs:(.configs // [])} end)
            | .defaults as $d
            | [ .configs | to_entries[]
                | (($d + .value).tag // ("cfg" + ((.key+1)|tostring|if length<2 then "0"+. else . end))) | tostring ]
            | .[:$b] | join(",")' "$MATRIX_FILE")
          if [ "$CUR_TAGS" != "$BATCH_TAGS" ]; then
            echo "⚠️ فایل بعد از شروع اجرا تغییر کرده؛ چیزی از آن حذف نشد (نتایج commit شده‌اند)."; exit 0
          fi
          jq --argjson b "$BATCH_COUNT" --argjson done "$DONE_JSON" '
            def auto: "cfg" + ((.key+1)|tostring|if length<2 then "0"+. else . end);
            . as $orig
            | (if type=="array" then {} else (.defaults // {}) end) as $d
            | (if type=="array" then . else (.configs // []) end) as $cfgs
            | [ $cfgs | to_entries[]
                | .key as $k
                | (.value + (if (($d + .value).tag // null) == null then {tag: auto} else {} end)) as $v
                | select( ($k < $b and ((($d + $v).tag | tostring) as $t | ($done | index($t)) != null)) | not )
                | $v ] as $rest
            | if ($orig|type)=="array" then $rest else ($orig + {configs: $rest}) end
          ' "$MATRIX_FILE" > /tmp/rest.json
          LEFT=$(jq 'if type=="array" then length else (.configs | length) end' /tmp/rest.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$LEFT" -eq 0 ]; then git rm -q "$MATRIX_FILE"; else cp /tmp/rest.json "$MATRIX_FILE"; git add "$MATRIX_FILE"; fi
          git commit -q -m "pool_matrix: $(jq length <<<"$DONE_JSON")/$BATCH_COUNT done, $LEFT left (run ${{ github.run_id }}) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q || true
            git push -q && { echo "✅ فایل تنظیمات به‌روز شد ($LEFT مانده)."; exit 0; }
            sleep 5
          done
          echo "⚠️ push فایل تنظیمات ناموفق بود (نتایج commit شده‌اند؛ فایل را دستی اصلاح کن)."

      - name: ۳) دور بعدی polish برای tagهای repeat (یک run مشترک با configs_json)
        if: ${{ steps.push.outputs.done != '' && steps.push.outputs.done != '[]' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
          MATRIX: ${{ needs.prebuild.outputs.matrix }}
          DONE_JSON: ${{ steps.push.outputs.done }}
        run: |
          ELIG=$(jq -c --argjson d "$DONE_JSON" '[ .[] | select((.tag as $t | ($d | index($t))) != null) | select(.polish=="true" and .repeat=="true") ]' <<<"$MATRIX")
          [ "$(jq length <<<"$ELIG")" -gt 0 ] || { echo "ℹ️ تنظیمات repeat در این دسته نیست."; exit 0; }
          if GH_TOKEN="$CROSS_TOKEN" gh api "repos/$THIRD_REPO/contents/interrupt.flag" >/dev/null 2>&1; then
            echo "🛑 interrupt.flag هست — تکرار polish متوقف شد."; exit 0
          fi
          NOW=$(date +%s)
          STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at 2>/dev/null || true)
          START_EPOCH=$(date -d "$STARTED" +%s 2>/dev/null || echo "$NOW")
          NEXT=$(jq -c --argjson now "$NOW" --argjson start "$START_EPOCH" '
            [ .[]
              | (.repeat_hours | tonumber) as $h
              | (.repeat_until | tonumber) as $u0
              | (.time_budget | tonumber) as $b
              | (if $u0 == 0 and $h > 0 then (($start + $h * 3600) | floor) else $u0 end) as $u
              | select($b > 0)
              | select($u == 0 or $now < $u)
              | . + {repeat_until: ($u | tostring), seed: ((((.seed | tonumber) + 1)) | tostring)} ]' <<<"$ELIG")
          N=$(jq length <<<"$NEXT")
          echo "🔁 دور بعدی: $N از $(jq length <<<"$ELIG") تنظیمات (بقیه: budget=0 یا مهلت repeat_hours تمام شده)"
          [ "$N" -gt 0 ] || exit 0
          for attempt in 1 2 3; do
            if gh workflow run pool_matrix.yml --repo "${{ github.repository }}" --ref main -f configs_json="$NEXT" 2>&1; then
              echo "✅ دور بعدی ثبت شد (تلاش $attempt)."; exit 0
            fi
            sleep 5
          done
          echo "❌ ثبت دور بعدی ناموفق بود."; exit 1
