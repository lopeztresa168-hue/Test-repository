name: Run Clean History

on:
  workflow_dispatch:

jobs:
  call-clean:
    uses: ./.github/workflows/clean-history.yml
    with:
      save_artifact: false
      user_name: "github-actions[bot]"
      user_email: "github-actions[bot]@users.noreply.github.com"
      commit_message: "Initial commit (history cleaned)"
      exclude_files: ""
      exclude_folders: ""
    secrets:
      token: ${{ secrets.PAT_GITHUB }}
