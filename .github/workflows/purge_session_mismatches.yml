name: پاک‌سازی خروجی‌های fixed با سشن نادرست

# اجرای دستی — چون این یه عملیات maintenance/یک‌بارمصرفه (بعد از فیکس granularity)
# نه بخشی از چرخه‌ی معمول پایپ‌لاین. با scan-only می‌تونی اول فقط گزارش رو ببینی،
# بعد با apply=true واقعاً حذف/ری‌کیو کن.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "اگر true باشه واقعاً حذف/ری‌کیو انجام می‌شه؛ اگر false فقط گزارش می‌ده (dry-run، هیچ تغییری اعمال نمی‌شه)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: purge-session-mismatches
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: چک‌اوت مخزن اصلی (همانی که batch_outputs/ توش هست)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: تنظیمات git برای commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: نصب Node.js (برای رمزگشایی AES) و gh CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # در صورت نیاز به وابستگی‌های پایتون، این مرحله را اضافه کنید
      - name: نصب وابستگی‌های پایتون (اختیاری)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: بررسی دسترسی gh CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh auth status || echo "gh auth از طریق GH_TOKEN env انجام می‌شود، نه login جدا"

      - name: اجرای اسکریپت پاک‌سازی/ری‌کیو
        env:
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD }}
          BATCH_OUTPUTS_ROOT: batch_outputs
        run: |
          MODE_FLAG="--scan-only"
          if [ "${{ inputs.apply }}" == "true" ]; then
            MODE_FLAG="--apply"
          fi
          echo "🔧 اجرا با فلگ: $MODE_FLAG"
          # ✅ تصحیح مسیر اسکریپت
          python3 scripts/purge_session_mismatches.py $MODE_FLAG

      - name: آپلود گزارش کامل به‌عنوان artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-mismatches-report
          path: /tmp/session_mismatches.json
          if-no-files-found: warn
          retention-days: 30
